<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nhận diện tin giả</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(720px, 100%);
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 35px rgba(32, 54, 86, 0.12);
        }

        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitle { margin: 0 0 24px; color: #61708a; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            min-height: 190px;
            resize: vertical;
            border: 1px solid #ccd5e2;
            border-radius: 10px;
            padding: 14px;
            font: inherit;
            line-height: 1.5;
        }

        textarea:focus {
            outline: 3px solid #d8e7ff;
            border-color: #3478db;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 20px;
            background: #2167c5;
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
        }

        button:hover { background: #18539f; }
        button:disabled { cursor: wait; opacity: 0.65; }
        #counter { color: #6b7890; font-size: 13px; }

        #result {
            display: none;
            margin-top: 22px;
            border-radius: 10px;
            padding: 16px;
            line-height: 1.6;
        }

        #result.real {
            display: block;
            color: #145c35;
            background: #e8f7ed;
            border: 1px solid #b9e6c6;
        }

        #result.fake {
            display: block;
            color: #8b2028;
            background: #fff0f1;
            border: 1px solid #f1bec3;
        }

        #result.error {
            display: block;
            color: #7a4d00;
            background: #fff8df;
            border: 1px solid #f0d477;
        }

        .bar {
            height: 10px;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 99px;
            background: #dfe5ec;
        }

        .bar span {
            display: block;
            height: 100%;
            transition: width 0.25s ease;
        }

        .note {
            margin: 20px 0 0;
            color: #738096;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Nhận diện tin giả</h1>
        <p class="subtitle">PhoBERT-SVM · Nhập nội dung bài viết để kiểm tra</p>

        <label for="newsText">Nội dung bài viết</label>
        <textarea id="newsText" placeholder="Nhập ít nhất 20 ký tự..."></textarea>

        <div class="actions">
            <button id="checkButton" type="button">Phân tích</button>
            <span id="counter">0 ký tự</span>
        </div>

        <section id="result" aria-live="polite"></section>
        <p class="note">Kết quả chỉ mang tính tham khảo, hãy kiểm chứng với nguồn tin chính thống.</p>
    </main>

    <script>
        const textInput = document.getElementById("newsText");
        const checkButton = document.getElementById("checkButton");
        const counter = document.getElementById("counter");
        const result = document.getElementById("result");

        function updateCounter() {
            counter.textContent = `${textInput.value.trim().length} ký tự`;
        }

        function showResult(type, content) {
            result.className = type;
            result.innerHTML = content;
        }

        textInput.addEventListener("input", updateCounter);

        checkButton.addEventListener("click", async () => {
            const text = textInput.value.trim();
            if (text.length < 20) {
                showResult("error", "Vui lòng nhập nội dung có ít nhất 20 ký tự.");
                return;
            }

            checkButton.disabled = true;
            showResult("error", "Đang phân tích...");

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "API không thể xử lý yêu cầu.");
                }

                const fakeProbability = Number(data.fake_probability);
                const confidence = (Number(data.confidence_score) * 100).toFixed(1);
                const probability = (fakeProbability * 100).toFixed(1);
                const type = data.is_fake ? "fake" : "real";
                const title = data.is_fake ? "⚠️ CẢNH BÁO: CÓ THỂ LÀ TIN GIẢ" : "✅ KẾT QUẢ: TIN THẬT";
                const color = data.is_fake ? "#d83a45" : "#1d9a55";

                showResult(type, `
                    <strong>${title}</strong><br>
                    Xác suất tin giả: ${probability}% · Độ tin cậy: ${confidence}%
                    <div class="bar"><span style="width: ${probability}%; background: ${color};"></span></div>
                    <small>Thời gian xử lý: ${data.processing_time_ms} ms</small>
                `);
            } catch (error) {
                showResult("error", `Không thể phân tích: ${error.message}`);
            } finally {
                checkButton.disabled = false;
            }
        });
    </script>
</body>
</html>
