<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fake News Detector</title>
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 12px; margin: 0; }
    h3 { margin-top: 0; color: #333; font-size: 16px; }
    textarea { width: 100%; height: 100px; resize: vertical; margin-bottom: 8px; padding: 6px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; padding: 8px 12px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #result { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 14px; display: none; }
    .real { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .fake { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <h3>Nhận Diện Tin Giả (PhoBERT-SVM)</h3>
  <textarea id="newsText" placeholder="Dán nội dung bài viết cần kiểm tra (tối thiểu 20 ký tự)..."></textarea>
  <button id="checkBtn">Kiểm Tra Tin Tức</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
