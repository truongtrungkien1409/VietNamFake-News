<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Fake News Detector</title>
  <style>
    body { width: 320px; font-family: Arial, sans-serif; padding: 12px; margin: 0; box-sizing: border-box; }
    h3 { margin-top: 0; color: #333; font-size: 15px; text-align: center; }
    .config-section { margin-bottom: 8px; font-size: 12px; display: flex; gap: 4px; }
    .config-section input { flex: 1; padding: 4px; font-size: 11px; }
    .config-section button { width: auto; padding: 4px 8px; font-size: 11px; }
    textarea { width: 100%; height: 90px; resize: vertical; margin-bottom: 6px; padding: 6px; box-sizing: border-box; font-size: 12px; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
    button { background-color: #007bff; color: white; border: none; padding: 7px 10px; flex: 1; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 12px; }
    button:hover { background-color: #0056b3; }
    button.secondary { background-color: #6c757d; }
    button.secondary:hover { background-color: #5a6268; }
    #result { margin-top: 8px; padding: 8px; border-radius: 4px; font-size: 13px; display: none; }
    .real { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .fake { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .progress-bar-container { background-color: #e9ecef; border-radius: 4px; height: 8px; width: 100%; margin-top: 6px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; transition: width 0.3s ease; }
    .warning-footer { margin-top: 10px; font-size: 10px; color: #666; text-align: center; font-style: italic; border-top: 1px solid #eee; padding-top: 6px; }
  </style>
</head>
<body>
  <h3>Nhận Diện Tin Giả (PhoBERT-SVM)</h3>
  
  <div class="config-section">
    <input type="text" id="apiUrlInput" placeholder="http://127.0.0.1:5000">
    <button id="saveConfigBtn" class="secondary">Lưu</button>
  </div>

  <textarea id="newsText" placeholder="Dán nội dung bài viết cần kiểm tra (tối thiểu 20 ký tự)..."></textarea>
  
  <div class="btn-group">
    <button id="getSelectionBtn" class="secondary">Lấy chữ chọn</button>
    <button id="checkBtn">Kiểm Tra</button>
  </div>

  <div id="result"></div>

  <div class="warning-footer">
    Kết quả chỉ hỗ trợ tham khảo, không thay thế kiểm chứng độc lập.
  </div>

  <script src="popup.js"></script>
</body>
</html>
